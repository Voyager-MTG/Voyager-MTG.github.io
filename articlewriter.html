	<script>
		
		let raw_gradients = null;

		let tab = "write";

		let has_author = false;

		modal = document.getElementById("modal-container");
		window.onclick = function (event) {
			if (event.target == modal) {
				document.getElementById('modal-container').style.display = 'none';
			}
		}
		document.addEventListener("DOMContentLoaded", async function () {
			while (!card_list_arrayified) await delay(100);
			console.log(card_list_arrayified);
			changeTab("write");
		});


		const tabs = [
			"write",
			"publish"
		]

		function changeTab(_tab) {
			tab = _tab;
			tab_to_edit = tab;
			if (tab == "write") {
				makePreviewTab();
			}
			if (tab == "publish") {
				fillPublishValues();
			}

			for (const tab_not_to_edit of tabs) {
				document.getElementById(`${tab_not_to_edit}-tab-select`).className = "tab-btn";
				document.getElementById(`${tab_not_to_edit}`).style.display = "none";
			}

			document.getElementById(`${tab_to_edit}-tab-select`).className = "tab-btn tab-btn-active";
			document.getElementById(`${tab_to_edit}`).style.display = "";
		}

		function fillPublishValues() {
			const article_text = document.getElementById("article-text").value;

			const match_name = article_text.match(/name: (.*?)\n/g);
			const article_name = match_name ? match_name[0].split("name:")[1].trim() : "";

			const match_author = article_text.match(/author: (.*?)\n/g);
			const article_author = match_author ? match_author[0].split("author:")[1].trim() : "";

			if (article_name)
				document.getElementById("article-name").value = article_name;
			if (article_author)
				document.getElementById("article-author").value = article_author;
		}

		function makePreviewTab() {
			const name = document.querySelector('.article-name').value;
			const article_text = `name: ${name}\n\n` + document.getElementById("article-text").value;
			const scroll = document.querySelector('.article-content').scrollTop;
			const article_html = parseMarkdown(article_text);
			document.getElementById("preview").innerHTML = article_html;
			document.querySelector('.article-content').scroll({
				top: scroll,
				behavior: 'instant'
			});
		}

		function reallyRand(x, seed = false) {
			const date = new Date();
			seed = seed ? seed : date.getUTCFullYear() * 10000 +
				date.getUTCMonth() * 100 +
				date.getUTCDate();

			const a = 1103515245;
			const c = 12345;
			const m = Math.pow(2, 31);

			let randomNumber = (a * seed + c) % m;
			randomNumber = randomNumber / m;

			return Math.floor(randomNumber * x);
		}

		function showCardHover(card_name, set = false, num = false) {
			// console.log(set, num);
			for (const card_stats of card_list_arrayified) {
				if (card_stats.type.includes("Token")) continue;
				if (card_stats.card_name == card_name && (!set || card_stats.set == set) && (!num || card_stats.number == num)) {
					const src = "/sets/" + card_stats.set + "-files/img/" + card_stats.position + ((card_stats.shape.includes("double")) ? "_front" : "") + "." + card_stats.image_type;

					const hover_card = document.getElementById("hover-card");
					hover_card.style.display = "block";
					hover_card.src = src;
					return;
				}
			}
		}

		function moveCardHover(event) {
			document.getElementById("hover-card").style.left = event.pageX + "px";
			document.getElementById("hover-card").style.top = event.pageY - 262 + "px";
		}

		function hideCardHover() {
			document.getElementById("hover-card").style.display = "none";
		}

		document.getElementById("search").addEventListener("keypress", function (event) {
			if (event.key === "Enter") {
				event.preventDefault();
				const url = new URL('search', window.location.origin);
				url.searchParams.append('search', document.getElementById("search").value);
				window.location.href = url;
			}
		});
		function randomCard() {
			let i = Math.floor(Math.random() * (card_list_arrayified.length + 1));
			let random_card = card_list_arrayified[i];

			const url = new URL('card', window.location.origin);
			const params = {
				set: random_card.set,
				num: random_card.number,
				name: random_card.card_name
			}
			for (const key in params) {
				url.searchParams.append(key, params[key]);
			}

			window.location.href = url;
		}
	</script>

		function cleanArticleText(name, textarea) {

			} else {
