		function newDeck(a, b) {
			if (a.last_modified && !b.last_modified) {
				return -1;
			}
			if (!a.last_modified && b.last_modified) {
				return 1;
			}
			if (!a.last_modified && !b.last_modified) {
				return 0;
			}

			let a_date = {};
			let b_date = {};

			let a_split = a.last_modified.split(',');
			let a_split2 = a_split[0].split('-');

			a_date.day = Number(a_split2[0]);
			a_date.month = Number(a_split2[1]);
			a_date.year = Number(a_split2[2]);

			a_date.hour = Number(a_split[1].split(":")[0]);
			a_date.min = Number(a_split[1].split(":")[1]);

			let b_split = b.last_modified.split(',');
			let b_split2 = b_split[0].split('-');

			b_date.day = Number(b_split2[0]);
			b_date.month = Number(b_split2[1]);
			b_date.year = Number(b_split2[2]);

			b_date.hour = Number(b_split[1].split(":")[0]);
			b_date.min = Number(b_split[1].split(":")[1]);

			if (a_date.year > b_date.year) {
				return -1;
			}
			if (a_date.year < b_date.year) {
				return 1;
			}
			if (a_date.month > b_date.month) {
				return -1;
			}
			if (a_date.month < b_date.month) {
				return 1;
			}
			if (a_date.day > b_date.day) {
				return -1;
			}
			if (a_date.day < b_date.day) {
				return 1;
			}
			if (a_date.hour > b_date.hour) {
				return -1;
			}
			if (a_date.hour < b_date.hour) {
				return 1;
			}
			if (a_date.min > b_date.min) {
				return -1;
			}
			if (a_date.min < b_date.min) {
				return 1;
			}
			return 0;
		}

		function tokenizeTerms(searchTerms) {
			let tokenRegex = /-?\w*[!:<>=]?(([^ \[\]"\(\)\/“”]+)|(\".+?\")|(\[.+\])|(\(.+?\))|(\/.+?\/)|(\“.+?\”))/g;
			let searchTokens = searchTerms.match(tokenRegex);

			return searchTokens;
		}

		function searchAllTokens(deck, tokens) {
			if (tokens == null || tokens == '') {
				return true;
			}
			for (let i = 0; i < tokens.length; i++) {
				if (tokens[i].charAt(0) == '+') {
					return searchAllTokens(deck, tokens.slice(0, i)) && searchAllTokens(deck, tokens.slice(i + 1));
				}
				if (tokens[i] == "or") {
					return searchAllTokens(deck, tokens.slice(0, i)) || searchAllTokens(deck, tokens.slice(i + 1));
				}
			}

			for (let token of tokens) {
				if (token.charAt(0) == '-') {
					return !searchToken(deck, token.substring(1)) && (tokens.length == 1 ? true : searchAllTokens(deck, tokens.slice(1)));
				}
				if (token.charAt(0) == '(') {
					return searchAllTokens(deck, tokenizeTerms(token.substring(1, token.length - 1))) && (tokens.length == 1 ? true : searchAllTokens(deck, tokens.slice(1)));
				}
				else {
					return searchToken(deck, token) && (tokens.length == 1 ? true : searchAllTokens(deck, tokens.slice(1)));
				}
			}
		}

		function removeDuplicateChars(str) {
			let ret_str = '';

			for (const c of str) {
				if (!ret_str.includes(c)) {
					ret_str += c;
				}
			}

			return ret_str;
		}

		function searchToken(deck, token) {
			let deck_stats = [];

			for (var key in deck) {
				if (isNaN(deck[key])) {
					deck_stats[key] = deck[key].toLowerCase();
				}
				else {
					deck_stats[key] = deck[key];
				}
			}

			const deck_name = deck_stats.name;
			const decklist = atob(deck.url.split(";")[1].split("&main")[0]).toLowerCase();
			// console.log(dec  klist);
			const deck_user = deck_stats.user;
			let deck_color = "";
			if (deck_stats.colors) {
				deck_color = deck_stats.colors;
			}

			let color_map = new Map([
				["azorius", "wu"],
				["dimir", "ub"],
				["rakdos", "br"],
				["gruul", "rg"],
				["selesnya", "gw"],
				["orzhov", "wb"],
				["golgari", "bg"],
				["simic", "gu"],
				["izzet", "ur"],
				["boros", "rw"],
				["esper", "wub"],
				["grixis", "ubr"],
				["jund", "brg"],
				["naya", "rgw"],
				["bant", "gwu"],
				["abzan", "wbg"],
				["sultai", "bgu"],
				["temur", "gur"],
				["jeskai", "urw"],
				["mardu", "rwb"],
			]);

			token = token.replaceAll("~", deck_name).replaceAll("cardname", deck_name).replaceAll('"', '').replaceAll('“', '').replaceAll('”', '');

			const modifierRegex = /[!:<>=]+/g;
			const match = token.match(modifierRegex);

			if (match) {
				const modifier = match[0];
				const term = token.substring(0, token.indexOf(modifier));
				let check = token.substring(token.indexOf(modifier) + modifier.length);

				if (check.charAt(0) == '/') {
					check = check.substring(1);
				}
				if (check.charAt(check.length - 1) == '/') {
					check = check.substring(0, check.length - 1);
				}


				// availableTokens = ["mv", "c", "ci", "t", "o", "pow", "tou", "r", "is"]

				/* template
				if (term == "mv")
				{
					if (modifier == "!" || modifier == "=")
					{

					}
					else if (modifier == ":")
					{

					}
					else if (modifier == "<")
					{

					}
					else if (modifier == ">")
					{

					}
				} */
				if (term == "c" || term == "card") {
					if (modifier == "!" || modifier == "=" || modifier == ":") {
						return decklist.includes(check);
					}
					// unsupported flows: 
					// else if (modifier == "<")
					// {

					// }
					// else if (modifier == ">")
					// {

					// }
				}
				if (term == "user") {
					if (modifier == "!" || modifier == "=") {
						return deck_user == check;
					}
					else if (modifier == ":") {
						return deck_user.includes(check);
					}
					// else if (modifier == "<")
					// {

					// }
					// else if (modifier == ">")
					// {

					// }
				}
				if (term == "color" || term == "colors") {
					if (modifier == "!" || modifier == "=") {
						return deck_color == check;
					}
					else if (modifier == ":") {
						return deck_color.includes(check);
					}
					else if (modifier == "<") {
						return deck_color < check;
					}
					else if (modifier == ">") {
						return deck_color > check;
					}
				}
				if (term == "event") {
					console.log("event", deck.event, modifier);
					if (modifier == "!" || modifier == "=" || modifier == ":") {
						return deck.event ? deck.event.toLowerCase().includes(check) : false;
					}
				}
			}

			const tl = token.length;

			if (token.substring(0, 2) == "[[" && token.substring(tl - 2) == "]]") {
				console.log("card", token)
				return decklist.includes(token.split("[[")[1].split("]]")[0].toLowerCase())
			}

			return deck_name.includes(token);
		}

		function isDecimal(char) {
			return char >= '0' && char <= '9';
		}

		function tokenize(text) {
			let tokens = [];

			for (let i = 0; i < text.length; i++) {
				if (i < text.length - 1) {
					if (text[i + 1] == '/') {
						tokens.push(text.substring(i, i + 3));
						i = i + 2;
					}
					else if (isDecimal(text[i]) && isDecimal(text[i + 1])) {
						tokens.push(text.substring(i, i + 2));
						i = i + 1;
					}
					else {
						tokens.push(text[i]);
					}
				}
				else {
					tokens.push(text[i]);
				}
			}

			return tokens;
		}
